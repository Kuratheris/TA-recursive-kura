name: Validate Spring Game Load

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SMOKE_MAP: Comet Catcher Redux

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            p7zip-full \
            wget \
            git \
            lua5.1 \
            libgl1 \
            libxcursor1 \
            libxrandr2 \
            libxinerama1 \
            libxi6 \
            libopenal1 \
            libvorbisfile3 \
            libfreetype6 \
            libcurl4 \
            ca-certificates

      - name: Install the checked-out game
        run: |
          game_dir="$HOME/.spring/games/TA-recursive.sdd"
          mkdir -p "$game_dir"
          git archive HEAD | tar -x -C "$game_dir"

      - name: Download and extract spring-headless
        run: |
          mkdir -p recoil_engine
          cd recoil_engine
          wget https://github.com/beyond-all-reason/RecoilEngine/releases/download/2025.06.05/recoil_2025.06.05_amd64-linux.7z
          7z x recoil_2025.06.05_amd64-linux.7z
          chmod +x ./spring-headless ./pr-downloader

      - name: Download map using pr-downloader
        run: |
          cd recoil_engine
          ./pr-downloader --download-map "$SMOKE_MAP"

      - name: Verify the game reaches the in-game state
        shell: bash
        run: |
          game_name=$(lua5.1 -e 'local mod = dofile("modinfo.lua"); assert(mod.name and mod.version); print(mod.name .. " " .. mod.version)')
          cd recoil_engine
          echo "Launching $game_name on $SMOKE_MAP"
          engine_status=0
          timeout 90s ./spring-headless -game "$game_name" -map "$SMOKE_MAP" > output.log 2>&1 || engine_status=$?

          # A headless game keeps running after startup, so timeout can be expected.
          if [[ "$engine_status" != 0 && "$engine_status" != 124 ]]; then
            echo "Recoil exited with status $engine_status"
            tail -n 150 output.log
            exit 1
          fi
          if grep -nE 'Fatal:|Internal Lua error: Call failure|Error: Failed to load: .*\.lua' output.log; then
            echo "Recoil reported a startup or Lua error"
            exit 1
          fi
          if ! grep -F "finished loading and is now ingame" output.log; then
            echo "The game did not reach the in-game state (Recoil status $engine_status)"
            tail -n 150 output.log
            exit 1
          fi
